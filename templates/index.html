<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电费监控 · 长沙理工大学</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root {
  --accent: #4f46e5;
  --accent-2: #7c3aed;
  --accent-soft: rgba(79,70,229,0.10);
  --bg: #fafafa;
  --bg-grad-1: rgba(99,102,241,0.06);
  --bg-grad-2: rgba(139,92,246,0.05);
  --surface: #ffffff;
  --surface-2: #f7f7f9;
  --border: #ececef;
  --border-strong: #e0e0e6;
  --text: #18181b;
  --text-soft: #52525b;
  --text-faint: #a1a1aa;
  --shadow: 0 1px 2px rgba(24,24,27,0.04);
  --shadow-hover: 0 1px 2px rgba(24,24,27,0.05), 0 12px 32px rgba(24,24,27,0.08);
  --radius: 16px;
  --radius-sm: 11px;
  --good: #16a34a;
  --warn: #ea580c;
  --bad: #dc2626;
}
[data-theme="dark"] {
  --accent: #818cf8;
  --accent-2: #a78bfa;
  --accent-soft: rgba(129,140,248,0.14);
  --bg: #09090b;
  --bg-grad-1: rgba(129,140,248,0.07);
  --bg-grad-2: rgba(167,139,250,0.05);
  --surface: #121215;
  --surface-2: #18181c;
  --border: #26262b;
  --border-strong: #303036;
  --text: #fafafa;
  --text-soft: #a1a1aa;
  --text-faint: #6b6b73;
  --shadow: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-hover: 0 1px 2px rgba(0,0,0,0.5), 0 16px 40px rgba(0,0,0,0.55);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: radial-gradient(1200px 600px at 15% -10%, var(--bg-grad-1), transparent 60%),
              radial-gradient(1000px 500px at 100% 0%, var(--bg-grad-2), transparent 55%),
              var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s, color 0.3s;
}
/* ===== Header ===== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1120px; margin: 0 auto; padding: 14px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand .logo {
  width: 42px; height: 42px; flex-shrink: 0;
  display: grid; place-items: center;
}
.brand .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand .titles h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.brand .titles p { font-size: 12px; color: var(--text-faint); margin-top: 1px; }
.theme-toggle {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-soft); cursor: pointer;
  display: grid; place-items: center; transition: all 0.2s;
}
.theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
.theme-toggle svg { width: 18px; height: 18px; }

/* ===== Selectors ===== */
.selector-bar {
  max-width: 1120px; margin: 0 auto; padding: 16px 20px 0;
  display: flex; gap: 12px; flex-wrap: wrap;
}
.field { position: relative; flex: 1; min-width: 200px; }
.field label {
  display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 6px; padding-left: 2px;
}
.field select {
  width: 100%; -webkit-appearance: none; appearance: none;
  padding: 11px 38px 11px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  box-shadow: var(--shadow);
}
.field select:hover { border-color: var(--accent); }
.field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .chev {
  position: absolute; right: 14px; top: 38px; pointer-events: none;
  color: var(--text-faint); width: 16px; height: 16px;
}

/* ===== Layout (bento grid) ===== */
.container { max-width: 1120px; margin: 0 auto; padding: 20px; }
.grid-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px;
}
.span-2 { grid-column: span 2; }
@media (max-width: 900px) {
  .grid-stats { grid-template-columns: repeat(2, 1fr); }
  .span-2 { grid-column: span 2; }
}
@media (max-width: 560px) {
  .grid-stats { grid-template-columns: 1fr; }
  .span-2 { grid-column: span 1; }
}

.card {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px;
  box-shadow: var(--shadow); transition: box-shadow 0.25s, transform 0.25s, border-color 0.25s;
}
/* spotlight follows cursor */
.card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--accent-soft), transparent 60%);
}
.card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: var(--border-strong); }
.card:hover::before { opacity: 1; }
.card > * { position: relative; }
.card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; gap: 12px;
}
.card-head h2 { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.card-head .sub { font-size: 12px; color: var(--text-faint); font-weight: 500; }

/* ===== Stat cards ===== */
.stat { display: flex; flex-direction: column; gap: 12px; }
.stat.hero {
  flex-direction: row; align-items: stretch; justify-content: space-between; gap: 16px;
  background:
    radial-gradient(600px circle at 100% 0%, var(--accent-soft), transparent 55%),
    var(--surface);
}
.hero-left { display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.hero-spark { flex: 1; min-width: 0; align-self: stretch; max-width: 55%; }
@media (max-width: 560px) { .hero-spark { display: none; } }
.stat .stat-top { display: flex; align-items: center; gap: 10px; }
.stat .icon {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0;
}
.stat .icon svg { width: 20px; height: 20px; }
.icon.i-accent { background: var(--accent-soft); color: var(--accent); }
.icon.i-violet { background: rgba(139,92,246,0.14); color: var(--accent-2); }
.icon.i-good { background: rgba(16,185,129,0.14); color: var(--good); }
.stat .label { font-size: 13px; color: var(--text-soft); font-weight: 550; }
.stat .value { font-size: 40px; font-weight: 750; letter-spacing: -0.025em; line-height: 1; }
.stat .value.value-xl { font-size: 52px; }
@media (max-width: 560px) { .stat .value.value-xl { font-size: 42px; } }
.stat .value .unit { font-size: 16px; font-weight: 600; color: var(--text-faint); margin-left: 4px; }
.stat .meta { font-size: 12px; color: var(--text-faint); }
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
}
.badge.b-good { background: rgba(16,185,129,0.13); color: var(--good); }
.badge.b-warn { background: rgba(245,158,11,0.14); color: var(--warn); }
.badge.b-bad { background: rgba(239,68,68,0.13); color: var(--bad); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ===== Status pills (in header row, right side) ===== */
.status-strip {
  margin-left: auto;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-soft);
  box-shadow: var(--shadow);
}
.pill svg { width: 14px; height: 14px; color: var(--text-faint); }
.pill b { color: var(--text); font-weight: 600; }
.pill.err { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--bad); }
.pill.err svg, .pill.err b { color: var(--bad); }

/* ===== Segmented controls ===== */
.segment {
  display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px;
  background: var(--surface-2); border: 1px solid var(--border);
}
.segment button {
  border: none; background: transparent; color: var(--text-soft);
  padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 550;
  cursor: pointer; transition: all 0.18s; white-space: nowrap;
}
.segment button:hover { color: var(--text); }
.segment button.active {
  background: var(--surface); color: var(--accent);
  box-shadow: 0 1px 3px rgba(16,24,40,0.1);
}
[data-theme="dark"] .segment button.active { background: var(--accent-soft); }

/* ===== Charts ===== */
.chart-box { height: 300px; width: 100%; }
.chart-tall { height: 420px; }

/* ===== Table ===== */
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  background: var(--surface-2); font-weight: 600; color: var(--text-soft);
  text-align: left; padding: 12px 16px; white-space: nowrap;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
  position: sticky; top: 0;
}
tbody td { padding: 12px 16px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
tbody tr { transition: background 0.12s; }
tbody tr:hover { background: var(--surface-2); }
td.num { font-weight: 600; }
.tag-used { color: var(--bad); }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all 0.18s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.btn svg { width: 15px; height: 15px; }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border: none;
}
.btn-primary:hover { color: #fff; filter: brightness(1.06); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ===== Pagination ===== */
.pager { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 18px; }
.pager button {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.18s;
  display: grid; place-items: center;
}
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button:disabled { opacity: 0.35; cursor: default; }
.pager button svg { width: 16px; height: 16px; }
.pager .info { font-size: 13px; color: var(--text-soft); font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }

.section-gap { margin-bottom: 16px; }
.footer { text-align: center; padding: 28px 20px 36px; color: var(--text-faint); font-size: 12.5px; }
.footer a { color: var(--accent); text-decoration: none; }

/* skeleton shimmer for loading values */
.shimmer { color: var(--text-faint); }

/* ===== Mobile optimizations ===== */
@media (max-width: 640px) {
  /* header: 状态药丸整组换到第二行占满，主题按钮留在品牌行右侧 */
  .topbar-inner { padding: 12px 16px; gap: 12px; row-gap: 10px; }
  .brand .logo { width: 38px; height: 38px; }
  .brand .titles h1 { font-size: 15px; }
  .brand .titles p { font-size: 11px; }
  .status-strip {
    order: 3; width: 100%; margin-left: 0;
    gap: 8px; justify-content: flex-start;
  }
  .pill { flex: 1; min-width: 0; justify-content: center; padding: 7px 10px; font-size: 12px; }
  .pill.err { flex-basis: 100%; }

  /* selectors 占满整行堆叠 */
  .selector-bar { padding: 14px 16px 0; gap: 10px; }
  .field { min-width: 0; flex-basis: 100%; }

  /* container & cards 更紧凑 */
  .container { padding: 16px; }
  .grid-stats { gap: 12px; margin-bottom: 12px; }
  .card { padding: 16px; border-radius: 14px; }
  .section-gap { margin-bottom: 12px; }

  /* card 头部：标题与分段控件换行 */
  .card-head { flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .card-head h2 { font-size: 14px; }
  .segment { width: 100%; justify-content: space-between; }
  .segment button { flex: 1; padding: 7px 4px; text-align: center; font-size: 12.5px; }

  /* hero 卡纵向排列、缩小数值 */
  .stat.hero { flex-direction: column; }
  .stat .value.value-xl { font-size: 40px; }
  .stat .value { font-size: 34px; }

  /* 图表降低高度，手机上更协调 */
  .chart-box { height: 240px; }
  .chart-tall { height: 320px; }

  /* 表格更紧凑，禁用 hover 位移 */
  table { font-size: 12.5px; }
  thead th { padding: 10px 12px; }
  tbody td { padding: 10px 12px; }
  .card:hover { transform: none; }

  /* 导出按钮占满整行 */
  .btn-row { width: 100%; }
  .btn-row .btn { flex: 1; justify-content: center; }

  .footer { padding: 24px 16px 32px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">
        <img src="{{ url_for('static', filename='csust-logo.png') }}" alt="长沙理工大学校徽">
      </div>
      <div class="titles">
        <h1>电费监控</h1>
        <p>长沙理工大学 · 宿舍用电仪表盘</p>
      </div>
    </div>
    <div class="status-strip">
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        上次查询 <b id="lastTime">--</b>
      </span>
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M5.6 5.6l2.9 2.9M3 12h4M5.6 18.4l2.9-2.9M12 21v-4M18.4 18.4l-2.9-2.9M21 12h-4M18.4 5.6l-2.9 2.9"/></svg>
        下次查询 <b id="nextRun">--</b>
      </span>
      <span class="pill err" id="errorPill" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <span id="errorText"></span>
      </span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题"></button>
  </div>
</header>

<div class="selector-bar">
  <div class="field">
    <label for="buildingSelect">楼栋</label>
    <select id="buildingSelect" onchange="onBuildingChange()"><option value="">加载中…</option></select>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
  </div>
  <div class="field">
    <label for="roomSelect">宿舍</label>
    <select id="roomSelect" onchange="onRoomChange()"><option value="">请先选择楼栋</option></select>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
  </div>
</div>

<div class="container">
  <!-- Stat cards (bento) -->
  <div class="grid-stats">
    <div class="card stat span-2 hero">
      <div class="hero-left">
        <div class="stat-top">
          <div class="icon i-accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg></div>
          <span class="label">当前剩余电量</span>
        </div>
        <div class="value value-xl"><span id="remaining" class="shimmer">--</span><span class="unit">kWh</span></div>
        <div class="meta"><span class="badge b-good" id="remainBadge" style="display:none"><span class="dot"></span><span id="remainBadgeText">充足</span></span></div>
      </div>
      <div class="hero-spark" id="heroSpark"></div>
    </div>
    <div class="card stat">
      <div class="stat-top">
        <div class="icon i-violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></div>
        <span class="label">近 24 小时用电</span>
      </div>
      <div class="value"><span id="usage24h" class="shimmer">--</span><span class="unit">kWh</span></div>
      <div class="meta" id="usage24hMeta">较昨日趋势</div>
    </div>
    <div class="card stat">
      <div class="stat-top">
        <div class="icon i-good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg></div>
        <span class="label">近 30 天日均</span>
      </div>
      <div class="value"><span id="avg30" class="shimmer">--</span><span class="unit">kWh</span></div>
      <div class="meta">每日平均用电量</div>
    </div>
  </div>

  <!-- Trend -->
  <div class="card section-gap">
    <div class="card-head">
      <h2>电量趋势</h2>
      <div class="segment" id="trendBtns">
        <button data-days="1">24小时</button>
        <button data-days="7" class="active">7天</button>
        <button data-days="30">30天</button>
        <button data-days="0">全部</button>
      </div>
    </div>
    <div class="chart-box" id="trendChart"></div>
  </div>

  <!-- Daily usage -->
  <div class="card section-gap">
    <div class="card-head">
      <h2>每日用电量 <span class="sub" id="usageAvg"></span></h2>
      <div class="segment" id="usageBtns">
        <button data-days="7">7天</button>
        <button data-days="30" class="active">30天</button>
        <button data-days="0">全部</button>
      </div>
    </div>
    <div class="chart-box" id="usageChart"></div>
  </div>

  <!-- Building compare -->
  <div class="card section-gap">
    <div class="card-head">
      <h2>楼栋电量对比 <span class="sub" id="buildingAvg"></span></h2>
      <div class="segment" id="buildingBtns">
        <button data-mode="remaining" class="active">当前电量</button>
        <button data-mode="1">今日用电</button>
        <button data-mode="7">7天用电</button>
      </div>
    </div>
    <div class="chart-box chart-tall" id="buildingChart"></div>
  </div>

  <!-- History table -->
  <div class="card section-gap">
    <div class="card-head">
      <h2>历史记录</h2>
      <div class="btn-row">
        <button class="btn" onclick="exportData('csv')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          CSV
        </button>
        <button class="btn" onclick="exportData('excel')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Excel
        </button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>时间</th><th>剩余 (kWh)</th><th>总量 (kWh)</th><th>已用 (kWh)</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prevPage" onclick="changePage(-1)" aria-label="上一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="info" id="pageInfo">--</span>
      <button id="nextPage" onclick="changePage(1)" aria-label="下一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>

  <!-- Full export -->
  <div class="card">
    <div class="card-head">
      <h2>导出全部数据</h2>
      <span class="sub">包含所有宿舍的完整历史</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="location.href='/api/export?format=csv'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        全部导出 CSV
      </button>
      <button class="btn btn-primary" onclick="location.href='/api/export?format=excel'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        全部导出 Excel
      </button>
    </div>
  </div>

  <div class="footer">长沙理工大学 · 电费监控仪表盘 · 数据每小时自动刷新</div>
</div>

<script>
/* ===== Theme ===== */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeToggle').innerHTML = t === 'dark' ? SUN : MOON;
  localStorage.setItem('theme', t);
  refreshChartsTheme();
}
(function initTheme() {
  const saved = localStorage.getItem('theme')
    || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', saved);
})();

/* ===== Chart theme helpers ===== */
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function chartTheme() {
  return {
    text: cssVar('--text-soft'),
    faint: cssVar('--text-faint'),
    line: cssVar('--border'),
    accent: cssVar('--accent'),
    accent2: cssVar('--accent-2'),
    surface: cssVar('--surface'),
  };
}
function baseAxis(ct) {
  return {
    axisLine: { lineStyle: { color: ct.line } },
    axisLabel: { color: ct.faint, fontSize: 11 },
    splitLine: { lineStyle: { color: ct.line, type: 'dashed' } },
    axisTick: { show: false },
    nameTextStyle: { color: ct.faint },
  };
}
function baseTooltip(ct) {
  return {
    backgroundColor: ct.surface,
    borderColor: ct.line,
    borderWidth: 1,
    textStyle: { color: cssVar('--text') },
    extraCssText: 'border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.12);',
  };
}

/* ===== State ===== */
const trendChart = echarts.init(document.getElementById('trendChart'));
const usageChart = echarts.init(document.getElementById('usageChart'));
const buildingChart = echarts.init(document.getElementById('buildingChart'));
const heroSpark = echarts.init(document.getElementById('heroSpark'));
let currentPage = 0, pageSize = 20, totalReadings = 0;
let currentRoomId = '', currentBuildingId = '';
let trendDays = 7, usageDays = 30, buildingMode = 'remaining';
let trendYaxis = 'adaptive';

async function fetchJSON(url) { return (await fetch(url)).json(); }
function roomParam() { return currentRoomId ? '&room_id=' + currentRoomId : ''; }

function getCookie(name) {
  const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
  return m ? decodeURIComponent(m[1]) : null;
}
function setCookie(name, value, days) {
  const exp = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + exp + '; path=/';
}

/* ===== Selectors ===== */
async function loadRooms(buildingId) {
  const url = buildingId ? '/api/rooms?building_id=' + buildingId : '/api/rooms';
  const rooms = await fetchJSON(url);
  const sel = document.getElementById('roomSelect');
  sel.innerHTML = rooms.map(r => `<option value="${r.room_id}">${r.room_name || r.room_id}</option>`).join('');
  const saved = getCookie('selected_room_id');
  const match = rooms.find(r => r.room_id === saved);
  currentRoomId = match ? match.room_id : (rooms.length ? rooms[0].room_id : '');
  sel.value = currentRoomId;
  loadAll();
}

async function loadBuildings() {
  const buildings = await fetchJSON('/api/buildings');
  const sel = document.getElementById('buildingSelect');
  sel.innerHTML = buildings.map(b => `<option value="${b.building_id}">${b.building_name || b.building_id}</option>`).join('');
  const saved = getCookie('selected_building_id');
  const match = buildings.find(b => b.building_id === saved);
  const chosen = match ? match.building_id : (buildings.length ? buildings[0].building_id : '');
  sel.value = chosen;
  currentBuildingId = chosen;
  await loadRooms(chosen);
}

async function onBuildingChange() {
  currentBuildingId = document.getElementById('buildingSelect').value;
  setCookie('selected_building_id', currentBuildingId, 365);
  await loadRooms(currentBuildingId);
}

function onRoomChange() {
  currentRoomId = document.getElementById('roomSelect').value;
  setCookie('selected_room_id', currentRoomId, 365);
  loadAll();
}

/* ===== Stat cards ===== */
function setRemainBadge(v) {
  const badge = document.getElementById('remainBadge');
  const txt = document.getElementById('remainBadgeText');
  if (v == null || v === '--') { badge.style.display = 'none'; return; }
  badge.style.display = 'inline-flex';
  badge.className = 'badge ' + (v >= 30 ? 'b-good' : v >= 10 ? 'b-warn' : 'b-bad');
  txt.textContent = v >= 30 ? '电量充足' : v >= 10 ? '注意余量' : '建议充值';
}

async function loadLatest() {
  const rows = await fetchJSON('/api/readings?days=1' + roomParam());
  const latest = rows.length ? rows[rows.length - 1] : null;
  if (latest) {
    document.getElementById('remaining').textContent = latest.remaining_kwh.toFixed(2);
    document.getElementById('remaining').classList.remove('shimmer');
    document.getElementById('lastTime').textContent = latest.timestamp.replace('T', ' ');
    setRemainBadge(latest.remaining_kwh);
  } else {
    document.getElementById('remaining').textContent = '--';
    document.getElementById('lastTime').textContent = '--';
    setRemainBadge(null);
  }
  let usage24h = 0;
  for (let i = 1; i < rows.length; i++) {
    const diff = rows[i - 1].remaining_kwh - rows[i].remaining_kwh;
    if (diff > 0) usage24h += diff;
  }
  const el = document.getElementById('usage24h');
  el.textContent = rows.length > 1 ? usage24h.toFixed(2) : '--';
  el.classList.remove('shimmer');
  drawHeroSpark(rows.map(r => r.remaining_kwh));
}

function drawHeroSpark(values) {
  const ct = chartTheme();
  if (!values || values.length < 2) { heroSpark.clear(); return; }
  heroSpark.setOption({
    grid: { left: 0, right: 0, top: 6, bottom: 6 },
    xAxis: { type: 'category', show: false, boundaryGap: false, data: values.map((_, i) => i) },
    yAxis: { type: 'value', show: false, min: Math.min(...values) * 0.96, max: Math.max(...values) * 1.02 },
    series: [{
      data: values, type: 'line', smooth: true, showSymbol: false,
      lineStyle: { color: ct.accent, width: 2.5 },
      areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: ct.accent + '40' }, { offset: 1, color: ct.accent + '00' }
      ]) }
    }]
  }, true);
}

async function loadStatus() {
  const s = await fetchJSON('/api/status');
  document.getElementById('nextRun').textContent = (s.next_run || '--').replace('T', ' ');
  const pill = document.getElementById('errorPill');
  if (s.last_error) {
    pill.style.display = 'inline-flex';
    document.getElementById('errorText').textContent = '错误: ' + s.last_error;
  } else { pill.style.display = 'none'; }
  if (s.trend_yaxis) trendYaxis = s.trend_yaxis;
}

/* ===== Charts ===== */
async function loadTrend(days) {
  trendDays = days;
  const data = await fetchJSON('/api/readings?days=' + days + roomParam());
  const values = data.map(r => r.remaining_kwh);
  const ct = chartTheme();
  const yAxisMin = trendYaxis === 'adaptive' && values.length ? Math.floor(Math.min(...values) * 0.95) : 0;
  trendChart.setOption({
    tooltip: { trigger: 'axis', ...baseTooltip(ct) },
    xAxis: { type: 'category', boundaryGap: false, data: data.map(r => r.timestamp.slice(5, 16)), ...baseAxis(ct) },
    yAxis: { type: 'value', name: 'kWh', min: yAxisMin, ...baseAxis(ct) },
    series: [{
      data: values, type: 'line', smooth: true, showSymbol: false,
      lineStyle: { color: ct.accent, width: 2.5 },
      itemStyle: { color: ct.accent },
      areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: ct.accent + '55' }, { offset: 1, color: ct.accent + '05' }
      ]) }
    }],
    grid: { left: 52, right: 22, top: 28, bottom: 30 }
  }, true);
}

async function loadUsage(days) {
  usageDays = days;
  const data = await fetchJSON('/api/daily_usage?days=' + days + roomParam());
  const vals = data.map(r => r.usage);
  const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : '--';
  document.getElementById('usageAvg').textContent = '日均 ' + avg + ' kWh';
  const ct = chartTheme();
  usageChart.setOption({
    tooltip: { trigger: 'axis', ...baseTooltip(ct) },
    xAxis: { type: 'category', data: data.map(r => r.date.slice(5)), ...baseAxis(ct) },
    yAxis: { type: 'value', name: 'kWh', ...baseAxis(ct) },
    series: [{
      data: vals, type: 'bar', barMaxWidth: 28,
      itemStyle: {
        borderRadius: [6, 6, 0, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: ct.accent2 }, { offset: 1, color: ct.accent }
        ])
      }
    }],
    grid: { left: 52, right: 22, top: 28, bottom: 30 }
  }, true);
}

async function loadBuildingChart(mode) {
  if (mode !== undefined) buildingMode = mode;
  const bParam = currentBuildingId ? '?building_id=' + currentBuildingId : '';
  let rows, valueKey, label, avgLabel;
  if (buildingMode === 'remaining') {
    rows = await fetchJSON('/api/latest_per_room' + bParam);
    rows = rows.filter(r => r.remaining_kwh >= 0).sort((a, b) => (a.room_name || '').localeCompare(b.room_name || '', 'zh'));
    valueKey = 'remaining_kwh'; label = '剩余电量 (kWh)'; avgLabel = '平均剩余电量';
  } else {
    const days = parseInt(buildingMode);
    rows = await fetchJSON('/api/usage_per_room' + bParam + (bParam ? '&' : '?') + 'days=' + days);
    rows = rows.sort((a, b) => (a.room_name || '').localeCompare(b.room_name || '', 'zh'));
    valueKey = 'usage'; label = (days === 1 ? '今日' : days + '天') + '用电量 (kWh)';
    avgLabel = (days === 1 ? '今日' : days + '天') + '平均用电量';
  }
  const vals = rows.map(r => r[valueKey]).filter(v => v != null);
  const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : '--';
  document.getElementById('buildingAvg').textContent = avgLabel + ' ' + avg + ' kWh';
  const ct = chartTheme();
  buildingChart.setOption({
    tooltip: { trigger: 'axis', ...baseTooltip(ct), formatter: p => `${p[0].name}<br/>${label}: <b>${p[0].value}</b>` },
    xAxis: { type: 'category', data: rows.map(r => r.room_name || r.room_id), ...baseAxis(ct), axisLabel: { rotate: 45, fontSize: 11, color: ct.faint } },
    yAxis: { type: 'value', name: 'kWh', ...baseAxis(ct) },
    series: [{
      type: 'bar', barMaxWidth: 32,
      data: rows.map(r => ({
        value: r[valueKey],
        itemStyle: {
          borderRadius: [5, 5, 0, 0],
          color: r.room_id === currentRoomId ? cssVar('--bad') : ct.accent
        }
      }))
    }],
    grid: { left: 52, right: 22, top: 24, bottom: 88 }
  }, true);
}

function refreshChartsTheme() {
  loadTrend(trendDays); loadUsage(usageDays); loadBuildingChart(); loadLatest();
}

/* ===== Table ===== */
async function loadTable() {
  const url = '/api/readings?days=0&page=' + currentPage + '&page_size=' + pageSize + roomParam();
  const result = await fetchJSON(url);
  totalReadings = result.total;
  document.getElementById('tableBody').innerHTML = result.rows.map(r =>
    `<tr><td>${r.timestamp.replace('T', ' ')}</td><td class="num">${r.remaining_kwh.toFixed(2)}</td><td class="num">${r.total_kwh.toFixed(2)}</td><td class="num tag-used">${r.used_kwh.toFixed(2)}</td></tr>`
  ).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text-faint);padding:28px">暂无数据</td></tr>';
  const totalPages = Math.ceil(totalReadings / pageSize) || 1;
  document.getElementById('pageInfo').textContent = `${currentPage + 1} / ${totalPages}`;
  document.getElementById('prevPage').disabled = currentPage <= 0;
  document.getElementById('nextPage').disabled = currentPage >= totalPages - 1;
}
function changePage(delta) { currentPage += delta; loadTable(); }
function exportData(fmt) { location.href = '/api/export?format=' + fmt + roomParam(); }

/* ===== Daily avg stat (30d) ===== */
async function loadAvg30() {
  const data = await fetchJSON('/api/daily_usage?days=30' + roomParam());
  const vals = data.map(r => r.usage);
  const el = document.getElementById('avg30');
  el.textContent = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : '--';
  el.classList.remove('shimmer');
}

/* ===== Wiring ===== */
function bindBtns(containerId, callback) {
  const el = document.getElementById(containerId);
  el.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    el.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const val = btn.dataset.mode !== undefined ? btn.dataset.mode : parseInt(btn.dataset.days);
    callback(val);
  });
}

function loadAll() {
  currentPage = 0;
  loadLatest(); loadAvg30(); loadTrend(trendDays); loadUsage(usageDays); loadTable(); loadBuildingChart();
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});
document.getElementById('themeToggle').innerHTML =
  document.documentElement.getAttribute('data-theme') === 'dark' ? SUN : MOON;

bindBtns('trendBtns', loadTrend);
bindBtns('usageBtns', loadUsage);
bindBtns('buildingBtns', loadBuildingChart);

loadStatus().then(() => loadBuildings());
setInterval(() => { loadLatest(); loadStatus(); }, 60000);
window.addEventListener('resize', () => { trendChart.resize(); usageChart.resize(); buildingChart.resize(); heroSpark.resize(); });

/* spotlight hover — track cursor position per card */
document.addEventListener('pointermove', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  card.style.setProperty('--my', (e.clientY - r.top) + 'px');
});
</script>
</body>
</html>
